<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Rummikub — La famille</title>
<style>
/* ==========================================================
   PALETTE
   ardoise  #2b2a2e   fond
   ardoise2 #37363c   panneaux
   ivoire   #f2ece0   tuiles
   encre    #1a1a1e   texte tuile noir
   grenat   #a8322f   texte tuile rouge
   azur     #2b5f8f   texte tuile bleu
   ambre    #c8721f   texte tuile orange
   laiton   #b99a5b   accents
   ========================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#2b2a2e;
  color:#e8e4dc;
  font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- ÉCRAN D'ACCUEIL ---------- */
#accueil{
  position:fixed;inset:0;z-index:100;
  background:#2b2a2e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:28px;text-align:center;
}
#accueil h1{
  font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-1px;
  color:#f2ece0;
}
#accueil h1 span{color:#c8721f}
.sous{color:#8f8a80;font-size:14px;max-width:300px;line-height:1.5}
.champ{
  width:100%;max-width:300px;padding:14px 16px;border-radius:12px;
  background:#37363c;border:1px solid #4a484f;color:#f2ece0;
  font-size:17px;text-align:center;font-family:inherit;
}
.champ:focus{outline:2px solid #b99a5b;outline-offset:1px}
.btn{
  width:100%;max-width:300px;padding:15px;border-radius:12px;
  background:#c8721f;color:#1a1a1e;font-weight:700;font-size:16px;
  transition:transform .1s;
}
.btn:active{transform:scale(.97)}
.btn.sec{background:#37363c;color:#e8e4dc;border:1px solid #4a484f}
.err{color:#e0705e;font-size:13px;min-height:16px}

/* ---------- SALON ---------- */
#salon{display:none;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:340px}
.code{
  font-size:38px;font-weight:800;letter-spacing:8px;color:#b99a5b;
  background:#37363c;padding:12px 20px;border-radius:12px;
}
.listeJ{width:100%;display:flex;flex-direction:column;gap:8px}
.joueurBox{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:#37363c;border-radius:10px;font-size:15px;
}
.pastille{width:9px;height:9px;border-radius:50%;background:#5fa87a;flex:none}
.pastille.vide{background:#4a484f}

/* ---------- BARRE HAUT ---------- */
#barre{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:#37363c;border-bottom:1px solid #4a484f;flex:none;
}
.tour{
  display:flex;flex-direction:column;gap:1px;padding:5px 9px;border-radius:8px;
  font-size:11px;line-height:1.2;background:#2b2a2e;min-width:0;flex:1;
}
.tour.actif{background:#c8721f;color:#1a1a1e}
.tour .nom{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour .nb{opacity:.7}
.tour.actif .nb{opacity:.8}

/* ---------- TAPIS ---------- */
#tapis{
  flex:1;overflow-y:auto;padding:10px;
  display:flex;flex-direction:column;gap:8px;
  background:
    repeating-linear-gradient(45deg,#302f34 0 6px,#2f2e33 6px 12px);
}
.combi{
  display:flex;gap:3px;padding:6px;border-radius:9px;
  background:#26252a;border:1px dashed #46444c;min-height:56px;
  align-items:center;flex-wrap:wrap;
}
.combi.invalide{border-color:#a8322f;background:#312426}
.combi.cible{border-color:#b99a5b;border-style:solid;background:#333037}
#vide{
  color:#6e6a63;text-align:center;padding:26px 12px;font-size:13px;line-height:1.6;
}

/* ---------- TUILES ---------- */
.t{
  width:36px;height:50px;border-radius:6px;flex:none;
  background:linear-gradient(#f7f2e8,#e6dfd0);
  color:#1a1a1e;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:21px;
  box-shadow:0 2px 0 #b8b0a0,0 3px 5px rgba(0,0,0,.35);
  position:relative;
  transition:transform .12s;
}
.t.n{color:#1a1a1e}
.t.r{color:#a8322f}
.t.b{color:#2b5f8f}
.t.o{color:#c8721f}
.t.j{font-size:24px;color:#7a5ea8}
.t.sel{
  transform:translateY(-9px);
  box-shadow:0 2px 0 #b8b0a0,0 10px 12px rgba(0,0,0,.5),0 0 0 2px #b99a5b;
}
.t.pose{animation:pose .22s ease-out}
@keyframes pose{
  0%{transform:translateY(-16px) rotate(-3deg);opacity:.6}
  100%{transform:translateY(0) rotate(0);opacity:1}
}
.t.neuf::after{
  content:'';position:absolute;inset:0;border-radius:6px;
  box-shadow:inset 0 0 0 2px #b99a5b;
}

/* ---------- CHEVALET ---------- */
#basZone{flex:none;background:#37363c;border-top:1px solid #4a484f}
#actions{
  display:flex;gap:6px;padding:7px 8px;overflow-x:auto;
}
.act{
  padding:9px 13px;border-radius:9px;background:#2b2a2e;
  font-size:13px;font-weight:600;white-space:nowrap;flex:none;
  border:1px solid #4a484f;
}
.act:active{background:#46444c}
.act.pri{background:#c8721f;color:#1a1a1e;border-color:#c8721f}
.act.pri:disabled{background:#4a484f;color:#7a766f;border-color:#4a484f}
.act:disabled{opacity:.4}
#chevalet{
  display:flex;gap:4px;padding:9px;overflow-x:auto;
  min-height:70px;align-items:center;
  background:
    linear-gradient(#3f3d44,#33323a);
  border-top:2px solid #b99a5b;
}
#chevalet .t{box-shadow:0 2px 0 #b8b0a0,0 4px 8px rgba(0,0,0,.45)}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);
  background:#1a1a1e;color:#f2ece0;padding:11px 17px;border-radius:10px;
  font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
  border:1px solid #4a484f;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- FIN ---------- */
#fin{
  position:fixed;inset:0;z-index:90;background:rgba(26,26,30,.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:28px;text-align:center;
}
#fin h2{font-size:30px;color:#c8721f;font-weight:800}
.score{width:100%;max-width:300px;display:flex;flex-direction:column;gap:6px}
.score div{
  display:flex;justify-content:space-between;padding:10px 14px;
  background:#37363c;border-radius:9px;font-size:15px;
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){
  .t{width:44px;height:60px;font-size:25px}
  .t.j{font-size:28px}
  #chevalet{min-height:82px}
}
</style>
</head>
<body>

<!-- ============ ACCUEIL ============ -->
<div id="accueil">
  <div id="acc1">
    <h1>Rummi<span>kub</span></h1>
    <p class="sous">La table de famille, à distance. Quatre joueurs, les vraies règles.</p>
    <br>
    <input class="champ" id="pseudo" placeholder="Ton prénom" maxlength="12" autocomplete="off">
    <br>
    <button class="btn" id="bCreer">Créer une partie</button>
    <br>
    <input class="champ" id="codeIn" placeholder="Code à 4 lettres" maxlength="4" autocomplete="off" style="text-transform:uppercase">

<!-- ============ JEU ============ -->
<div id="barre"></div>
<div id="tapis"><div id="vide">Le tapis est vide.<br>Pose ta première combinaison : 30 points minimum.</div></div>

<div id="basZone">
  <div id="actions">
    <button class="act pri" id="bValider">Valider</button>
    <button class="act" id="bAnnuler">Annuler</button>
    <button class="act" id="bPiocher">Piocher</button>

</div>

<script type="module">
/* =====================================================================
   Configuration Firebase — projet art-de-vivre-6c94d
   ===================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyB8P8QzuzQErc_lPQ6900RK-vtrc6nQSKU",
  authDomain:        "art-de-vivre-6c94d.firebaseapp.com",
  databaseURL:       "https://art-de-vivre-6c94d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "art-de-vivre-6c94d",
  storageBucket:     "art-de-vivre-6c94d.firebasestorage.app",
  messagingSenderId: "838349773052",
  appId:             "1:838349773052:web:11c1f5c6c13b3fff571f79"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, get, onValue, onDisconnect, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* =====================================================================
   ÉTAT LOCAL
   ===================================================================== */
const COUL = ['n','r','b','o'];               // noir rouge bleu orange
let codePartie = null;
let monId      = null;
let monNom     = '';
let etat       = null;                        // miroir de la base
let selection  = [];                          // tuiles sélectionnées au chevalet
let tapisLocal = null;                        // brouillon du tour en cours
let mainLocale = null;
let cibleCombi = null;                        // index de la combi visée
let tuilesPosees = new Set();                 // ids posés ce tour

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* =====================================================================
   PIOCHE ET TUILES
   Une tuile = {id, c: couleur, v: valeur, j: joker}
   ===================================================================== */
function fabriquerPioche(){
  const p = [];
  let n = 0;
  for(let serie = 0; serie < 2; serie++)
    for(const c of COUL)
      for(let v = 1; v <= 13; v++)
        p.push({id:'t'+(n++), c, v, j:false});
  p.push({id:'t'+(n++), c:'j', v:0, j:true});
  p.push({id:'t'+(n++), c:'j', v:0, j:true});
  // mélange Fisher-Yates
  for(let i = p.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [p[i], p[k]] = [p[k], p[i]];
  }
  return p;
}

/* =====================================================================
   VALIDATION DES COMBINAISONS — règles officielles
   Suite : 3+ tuiles même couleur, valeurs consécutives, max 13
   Groupe: 3 ou 4 tuiles même valeur, couleurs toutes différentes
   Jokers: remplacent n'importe quelle tuile
   ===================================================================== */
function valideCombi(combi){
  if(!combi || combi.length < 3) return false;
  const jokers  = combi.filter(t => t.j).length;
  const reelles = combi.filter(t => !t.j);
  if(reelles.length === 0) return false;

  // --- Tentative GROUPE ---
  const memeValeur = reelles.every(t => t.v === reelles[0].v);
  if(memeValeur && combi.length <= 4){
    const couleurs = new Set(reelles.map(t => t.c));
    if(couleurs.size === reelles.length) return true;
  }

  // --- Tentative SUITE ---
  const memeCoul = reelles.every(t => t.c === reelles[0].c);
  if(memeCoul){
    const vals = reelles.map(t => t.v).sort((a,b) => a - b);
    if(new Set(vals).size !== vals.length) return false;      // doublon
    const trous = vals[vals.length-1] - vals[0] + 1 - vals.length;
    if(trous < 0 || trous > jokers) return false;
    const restants = jokers - trous;                          // jokers aux extrémités
    const bas  = vals[0] - 1;
    const haut = 13 - vals[vals.length-1];
    if(restants > bas + haut) return false;
    if(vals[vals.length-1] > 13 || vals[0] < 1) return false;
    return true;
  }
  return false;
}

// Points d'une combinaison (jokers = valeur de la tuile qu'ils remplacent)
function pointsCombi(combi){
  const reelles = combi.filter(t => !t.j);
  const jokers  = combi.filter(t => t.j).length;
  if(!reelles.length) return 0;

  const memeValeur = reelles.every(t => t.v === reelles[0].v);
  if(memeValeur && combi.length <= 4 && new Set(reelles.map(t=>t.c)).size === reelles.length)
    return reelles[0].v * combi.length;                       // groupe

  // suite : on reconstitue les valeurs manquantes
  const vals = reelles.map(t => t.v).sort((a,b) => a - b);
  let total = vals.reduce((s,v) => s + v, 0);
  let jr = jokers;
  // trous internes
  for(let v = vals[0]; v <= vals[vals.length-1] && jr > 0; v++){
    if(!vals.includes(v)){ total += v; jr--; }
  }
  // extrémités : on privilégie le haut (plus de points), dans la limite 1–13
  let haut = vals[vals.length-1];
  while(jr > 0 && haut < 13){ haut++; total += haut; jr--; }
  let bas = vals[0];
  while(jr > 0 && bas > 1){ bas--; total += bas; jr--; }
  return total;
  // note : si jr > 0 ici, la combi a déjà été rejetée par valideCombi
}

function pointsMain(main){
  return main.reduce((s,t) => s + (t.j ? 30 : t.v), 0);
}

/* =====================================================================
   RENDU
   ===================================================================== */
function elTuile(t, opts = {}){
  const d = document.createElement('div');
  d.className = 't ' + (t.j ? 'j' : t.c);
  d.textContent = t.j ? '★' : t.v;
  d.dataset.id = t.id;
  if(opts.sel)  d.classList.add('sel');
  if(opts.neuf) d.classList.add('neuf');
  if(opts.pose) d.classList.add('pose');
  return d;
}

function dessinerBarre(){
  const b = $('#barre');
  b.innerHTML = '';
  (etat.ordre || []).forEach(id => {
    const j = etat.joueurs[id];
    if(!j) return;
    const d = document.createElement('div');
    d.className = 'tour' + (etat.tourDe === id ? ' actif' : '');
    d.innerHTML = `<span class="nom">${j.nom}</span>
      <span class="nb">${(j.main||[]).length} tuiles${j.sorti ? ' · sorti' : ''}</span>`;
    b.appendChild(d);
  });
}

function dessinerTapis(){
  const z = $('#tapis');
  z.innerHTML = '';
  const combis = tapisLocal || [];
  if(!combis.length){
    z.innerHTML = `<div id="vide">Le tapis est vide.<br>Pose ta première combinaison : 30 points minimum.</div>`;
    return;
  }
  combis.forEach((combi, i) => {
    const c = document.createElement('div');
    c.className = 'combi';
    if(combi.length && !valideCombi(combi)) c.classList.add('invalide');
    if(cibleCombi === i) c.classList.add('cible');
    combi.forEach(t => c.appendChild(elTuile(t, {
      neuf: tuilesPosees.has(t.id),
      pose: tuilesPosees.has(t.id)
    })));
    c.onclick = () => {
      if(!monTour()) return toast('Ce n\'est pas ton tour');
      if(selection.length){ poserSur(i); }
      else { cibleCombi = cibleCombi === i ? null : i; dessinerTapis(); }
    };
    z.appendChild(c);
  });
}

function dessinerChevalet(){
  const z = $('#chevalet');
  z.innerHTML = '';
  (mainLocale || []).forEach(t => {
    const d = elTuile(t, {sel: selection.includes(t.id)});
    d.onclick = () => {
      if(!monTour()) return toast('Ce n\'est pas ton tour');
      selection = selection.includes(t.id)
        ? selection.filter(x => x !== t.id)
        : [...selection, t.id];
      dessinerChevalet();
    };
    z.appendChild(d);
  });
  const mien = monTour();
  $('#bPiocher').disabled = !mien || tuilesPosees.size > 0;
  $('#bValider').disabled = !mien;
  $('#bNouvelle').disabled = !mien;
}

function toutDessiner(){ dessinerBarre(); dessinerTapis(); dessinerChevalet(); }

let tId;
function toast(m){
  const t = $('#toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(tId); tId = setTimeout(() => t.classList.remove('on'), 2400);
}

function monTour(){ return etat && etat.tourDe === monId && etat.phase === 'jeu'; }

/* =====================================================================
   ACTIONS DE JEU
   ===================================================================== */
function poserSur(i){
  if(!selection.length) return;
  const tuiles = mainLocale.filter(t => selection.includes(t.id));
  tapisLocal[i] = [...tapisLocal[i], ...tuiles];
  trierCombi(tapisLocal[i]);
  tuiles.forEach(t => tuilesPosees.add(t.id));
  mainLocale = mainLocale.filter(t => !selection.includes(t.id));
  selection = []; cibleCombi = null;
  toutDessiner();
}

// range visuellement une combi (suite croissante, jokers en bout)
function trierCombi(c){
  const j = c.filter(t => t.j), r = c.filter(t => !t.j);
  r.sort((a,b) => a.v - b.v);
  const memeVal = r.length && r.every(t => t.v === r[0].v);
  if(memeVal){ c.length = 0; c.push(...r, ...j); return; }
  // suite : insérer les jokers dans les trous
  const out = []; let jr = [...j];
  for(let k = 0; k < r.length; k++){
    out.push(r[k]);
    if(k < r.length - 1){
      let manque = r[k+1].v - r[k].v - 1;
      while(manque-- > 0 && jr.length) out.push(jr.shift());
    }
  }
  c.length = 0; c.push(...out, ...jr);
}

$('#bNouvelle').onclick = () => {
  if(!monTour()) return;
  if(!selection.length) return toast('Sélectionne d\'abord des tuiles');
  const tuiles = mainLocale.filter(t => selection.includes(t.id));
  tapisLocal.push([...tuiles]);
  trierCombi(tapisLocal[tapisLocal.length - 1]);
  tuiles.forEach(t => tuilesPosees.add(t.id));
  mainLocale = mainLocale.filter(t => !selection.includes(t.id));
  selection = [];
  toutDessiner();
};

$('#bTrier').onclick = () => {
  if(!mainLocale) return;
  mainLocale.sort((a,b) =>
    a.j - b.j || COUL.indexOf(a.c) - COUL.indexOf(b.c) || a.v - b.v);
  dessinerChevalet();
};

$('#bAnnuler').onclick = () => {
  if(!etat) return;
  tapisLocal   = JSON.parse(JSON.stringify(etat.tapis || []));
  mainLocale   = JSON.parse(JSON.stringify(etat.joueurs[monId].main || []));
  selection    = []; tuilesPosees = new Set(); cibleCombi = null;
  toutDessiner();
  toast('Tour remis à zéro');
};

$('#bPiocher').onclick = async () => {
  if(!monTour()) return;
  if(tuilesPosees.size) return toast('Annule d\'abord tes poses');
  await runTransaction(ref(db, 'parties/' + codePartie), p => {
    if(!p || p.tourDe !== monId) return p;
    const pio = p.pioche || [];
    if(!pio.length){ p.tourDe = suivant(p, monId); return p; }
    const t = pio.pop();
    p.joueurs[monId].main = [...(p.joueurs[monId].main || []), t];
    p.pioche = pio;
    p.tourDe = suivant(p, monId);
    p.dernier = monNom + ' a pioché';
    return p;
  });
};

$('#bValider').onclick = async () => {
  if(!monTour()) return;

  // rien fait → équivaut à piocher
  if(!tuilesPosees.size) return toast('Pose des tuiles ou pioche');

  // 1. toutes les combis du tapis doivent être valides
  const combis = tapisLocal.filter(c => c.length);
  if(combis.some(c => !valideCombi(c)))
    return toast('Une combinaison est invalide (bordure rouge)');

  // 2. première pose : 30 points minimum, sans manipuler le tapis
  const moi = etat.joueurs[monId];
  if(!moi.sorti){
    const tapisOrigine = etat.tapis || [];
    // toutes les tuiles posées doivent former des combis neuves
    const idsOrigine = new Set(tapisOrigine.flat().map(t => t.id));
    const combisNeuves = combis.filter(c => c.every(t => !idsOrigine.has(t.id)));
    const idsNeufs = new Set(combisNeuves.flat().map(t => t.id));
    if([...tuilesPosees].some(id => !idsNeufs.has(id)))
      return toast('Première pose : tu ne peux pas encore toucher au tapis');
    const pts = combisNeuves.reduce((s,c) => s + pointsCombi(c), 0);
    if(pts < 30) return toast(`Première pose : ${pts} points sur 30 requis`);
  }

  const gagne = mainLocale.length === 0;

  await update(ref(db, 'parties/' + codePartie), {
    tapis: combis,
    ['joueurs/' + monId + '/main']: mainLocale,
    ['joueurs/' + monId + '/sorti']: true,
    tourDe: gagne ? monId : suivant(etat, monId),
    phase:  gagne ? 'fin' : 'jeu',
    vainqueur: gagne ? monId : null,
    dernier: monNom + (gagne ? ' a gagné !' : ' a posé')
  });
  tuilesPosees = new Set();
};

function suivant(p, id){
  const o = p.ordre || [];
  return o[(o.indexOf(id) + 1) % o.length];
}

/* =====================================================================
   SALON / CRÉATION / SYNCHRO
   ===================================================================== */
function codeAleatoire(){
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  return [...Array(4)].map(() => L[Math.floor(Math.random()*L.length)]).join('');
}

$('#bCreer').onclick = async () => {
  monNom = $('#pseudo').value.trim();
  if(!monNom) return err('Entre ton prénom');
  codePartie = codeAleatoire();
  monId = 'j' + Date.now().toString(36);
  await set(ref(db, 'parties/' + codePartie), {
    hote: monId, phase:'salon', tapis:[], pioche:[], ordre:[monId],
    joueurs: { [monId]: {nom:monNom, main:[], sorti:false, en:true} },
    cree: Date.now()
  });
  entrerSalon();
};

$('#bRejoindre').onclick = async () => {
  monNom = $('#pseudo').value.trim();
  const c = $('#codeIn').value.trim().toUpperCase();
  if(!monNom) return err('Entre ton prénom');
  if(c.length !== 4) return err('Le code fait 4 lettres');
  const snap = await get(ref(db, 'parties/' + c));
  if(!snap.exists()) return err('Aucune partie avec ce code');
  const p = snap.val();
  if(p.phase !== 'salon') return err('La partie a déjà commencé');
  if(Object.keys(p.joueurs || {}).length >= 4) return err('La table est complète');
  codePartie = c;
  monId = 'j' + Date.now().toString(36);
  await update(ref(db, 'parties/' + c), {
    ['joueurs/' + monId]: {nom:monNom, main:[], sorti:false, en:true},
    ordre: [...(p.ordre || []), monId]
  });
  entrerSalon();
};

function err(m){ $('#errAcc').textContent = m; }

function entrerSalon(){
  $('#acc1').style.display = 'none';
  $('#salon').style.display = 'flex';
  $('#codeAff').textContent = codePartie;
  history.replaceState(null, '', '?p=' + codePartie);
  onDisconnect(ref(db, `parties/${codePartie}/joueurs/${monId}/en`)).set(false);
  ecouter();
}

$('#bPartage').onclick = async () => {
  const url = location.origin + location.pathname + '?p=' + codePartie;
  const txt = `Rejoins la partie de Rummikub — code ${codePartie}\n${url}`;
  if(navigator.share){ try{ await navigator.share({text:txt, url}); }catch(e){} }
  else { await navigator.clipboard.writeText(txt); toast('Lien copié'); }
};

$('#bDemarrer').onclick = async () => {
  const n = Object.keys(etat.joueurs || {}).length;
  if(n < 2) return $('#errSalon').textContent = 'Il faut au moins 2 joueurs';
  const pioche = fabriquerPioche();
  const joueurs = {...etat.joueurs};
  for(const id of etat.ordre){
    joueurs[id] = {...joueurs[id], main: pioche.splice(0,14), sorti:false};
  }
  await update(ref(db, 'parties/' + codePartie), {
    phase:'jeu', pioche, joueurs, tapis:[],
    tourDe: etat.ordre[0], vainqueur:null
  });
};

$('#bRejouer').onclick = async () => {
  const pioche = fabriquerPioche();
  const joueurs = {...etat.joueurs};
  for(const id of etat.ordre) joueurs[id] = {...joueurs[id], main: pioche.splice(0,14), sorti:false};
  await update(ref(db, 'parties/' + codePartie), {
    phase:'jeu', pioche, joueurs, tapis:[], tourDe: etat.ordre[0], vainqueur:null
  });
  $('#fin').style.display = 'none';
};

function ecouter(){
  onValue(ref(db, 'parties/' + codePartie), snap => {
    if(!snap.exists()) return;
    const p = snap.val();
    const changementTour = !etat || etat.tourDe !== p.tourDe;
    etat = p;

    // --- salon ---
    if(p.phase === 'salon'){
      const l = $('#listeJ'); l.innerHTML = '';
      (p.ordre || []).forEach(id => {
        const j = p.joueurs[id]; if(!j) return;
        const d = document.createElement('div');
        d.className = 'joueurBox';
        d.innerHTML = `<span class="pastille ${j.en ? '' : 'vide'}"></span>${j.nom}${id === p.hote ? ' · hôte' : ''}`;
        l.appendChild(d);
      });
      $('#bDemarrer').style.display = (p.hote === monId) ? 'block' : 'none';
      if(p.hote !== monId) $('#errSalon').textContent = 'En attente de l\'hôte…';
      return;
    }

    // --- jeu ---
    $('#accueil').style.display = 'none';
    if(changementTour || !tapisLocal){
      tapisLocal   = JSON.parse(JSON.stringify(p.tapis || []));
      mainLocale   = JSON.parse(JSON.stringify((p.joueurs[monId] || {}).main || []));
      tuilesPosees = new Set(); selection = []; cibleCombi = null;
      if(p.tourDe === monId && p.phase === 'jeu') toast('À toi de jouer');
      else if(p.dernier) toast(p.dernier);
    }
    toutDessiner();

    // --- fin ---
    if(p.phase === 'fin'){
      $('#fin').style.display = 'flex';
      $('#finTitre').textContent = p.joueurs[p.vainqueur].nom + ' gagne';
      const s = $('#finScore'); s.innerHTML = '';
      let total = 0;
      const lignes = [];
      p.ordre.forEach(id => {
        if(id === p.vainqueur) return;
        const pts = pointsMain(p.joueurs[id].main || []);
        total += pts;
        lignes.push([p.joueurs[id].nom, '−' + pts]);
      });
      lignes.unshift([p.joueurs[p.vainqueur].nom, '+' + total]);
      lignes.forEach(([n,v]) => {
        const d = document.createElement('div');
        d.innerHTML = `<span>${n}</span><strong>${v}</strong>`;
        s.appendChild(d);
      });
    } else {
      $('#fin').style.display = 'none';
    }
  });
}

/* --- lien direct avec code dans l'URL --- */
const codeUrl = new URLSearchParams(location.search).get('p');
if(codeUrl){ $('#codeIn').value = codeUrl.toUpperCase(); }


</script>
